name: iOS Swift Package

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Select Swift toolchain
        run: swift --version
      - name: Build Swift package
        run: swift build -v
